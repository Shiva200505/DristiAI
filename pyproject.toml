[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drishti-ai-backend"
version = "0.1.0"
description = "Local-first security engineering backend"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.100",
  "uvicorn>=0.23",
  "sqlalchemy>=2.0",
  "pydantic>=2.0",
  "psutil>=5.9"
]

[tool.pytest.ini_options]
pythonpath = ["."]
