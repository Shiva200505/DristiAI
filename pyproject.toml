[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drishti-ai-backend"
version = "0.1.0"
description = "Local-first security engineering backend"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.100",
  "uvicorn>=0.23",
  "sqlalchemy>=2.0",
  "pydantic>=2.0",
  "psutil>=5.9"
]

[project.optional-dependencies]
security = ["bandit>=1.7", "semgrep>=1.90"]
ai = ["llama-cpp-python>=0.3", "sentence-transformers>=3.0"]
qnn = ["onnxruntime>=1.18"]

[tool.pytest.ini_options]
pythonpath = ["."]
